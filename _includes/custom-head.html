<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body, h1, h2, h3, h4, h5, h6, .site-title, .site-nav, .post-link, code, pre {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  code, pre { font-family: "Pretendard", Consolas, monospace; }
</style>
<style>
  .post-content img { cursor: zoom-in; max-width: 100%; height: auto; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 96vh; image-rendering: auto; box-shadow: 0 0 24px rgba(0,0,0,.6); }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.id = 'lightbox';
    var big = document.createElement('img');
    box.appendChild(big);
    document.body.appendChild(box);
    function close() { box.classList.remove('open'); }
    box.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    document.querySelectorAll('.post-content img').forEach(function (img) {
      img.addEventListener('click', function () { big.src = img.src; big.alt = img.alt; box.classList.add('open'); });
    });
  });
</script>
